# Compila o PJe-Calc Backup a partir do código-fonte e publica em Releases.
# Dispara quando uma tag "v*" (ex.: v1.2.0) é enviada, ou manualmente.
name: Compilar e publicar

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File app\compilar.ps1

      - name: Pacote e SHA-256
        shell: pwsh
        run: |
          $s = 'app/saida'
          Copy-Item backup-calculos/backup-calculos.bat, backup-calculos/LEIA-ME.txt $s -Force
          $nome = if ($env:GITHUB_REF_NAME -like 'v*') { "PJeCalcBackup-$env:GITHUB_REF_NAME.zip" } else { 'PJeCalcBackup.zip' }
          Compress-Archive -Path "$s/PJeCalcBackup.exe", "$s/PJeCalcBackup-Console.exe", "$s/backup-calculos.bat", "$s/LEIA-ME.txt" -DestinationPath "$s/$nome" -Force
          $linhas = foreach ($f in 'PJeCalcBackup.exe', 'PJeCalcBackup-Console.exe', $nome) { "$f  SHA-256: $((Get-FileHash "$s/$f" -Algorithm SHA256).Hash)" }
          [IO.File]::WriteAllLines("$PWD/$s/SHA256.txt", $linhas)
          Get-Content "$s/SHA256.txt"
          "PACOTE=$nome" | Out-File $env:GITHUB_ENV -Append

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: PJeCalcBackup
          path: |
            app/saida/*.exe
            app/saida/*.zip
            app/saida/SHA256.txt

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = Get-Content app/saida/SHA256.txt
          $notas = @(
            '**Para usar:** baixe **PJeCalcBackup.exe** e dê dois cliques. Não precisa instalar.',
            '',
            '**Versão para o CMD:** baixe o pacote **' + $env:PACOTE + '** (traz o PJeCalcBackup-Console.exe e o backup-calculos.bat).',
            '',
            'Na primeira vez o Windows pode mostrar *O Windows protegeu o computador* (o programa não tem assinatura digital paga): clique em **Mais informações → Executar assim mesmo**.',
            '',
            'Compilado automaticamente pelo GitHub a partir do código deste repositório.',
            '',
            '```'
          ) + $sha + @('```')
          [IO.File]::WriteAllLines("$PWD/notas.md", $notas, (New-Object Text.UTF8Encoding $false))
          gh release create $env:GITHUB_REF_NAME app/saida/PJeCalcBackup.exe app/saida/PJeCalcBackup-Console.exe "app/saida/$env:PACOTE" app/saida/SHA256.txt --title "PJe-Calc Backup $env:GITHUB_REF_NAME" --notes-file notas.md
